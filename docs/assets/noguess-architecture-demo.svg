<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <style>
    .bg{fill:#f8fafc}.ink{fill:#0f172a}.muted{fill:#475569}.blue{fill:#2563eb}.bluebg{fill:#dbeafe}
    .red{fill:#b91c1c}.redbg{fill:#fee2e2}.green{fill:#166534}.greenbg{fill:#dcfce7}
    .amber{fill:#92400e}.amberbg{fill:#fef3c7}.slatebg{fill:#eef2f7}.white{fill:white}
    .card{fill:white;stroke:#cbd5e1;stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none}
    .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .h1{font-size:54px;font-weight:800}.h2{font-size:27px;font-weight:700}.h3{font-size:20px;font-weight:700}
    .body{font-size:17px}.small{font-size:14px}.tiny{font-size:12px}.mono{font-family:Consolas,Menlo,monospace}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="1600" height="900"/>
<text x="42" y="76" class="h1 ink">NoGuess</text>
<line x1="310" y1="30" x2="310" y2="88" stroke="#94a3b8" stroke-width="2"/>
<text x="340" y="59" class="h2 ink">An epistemic control plane for AI coding agents</text>
<text x="340" y="87" class="body muted">Bob can write the code. NoGuess makes sure nobody silently invented the requirement.</text>
<rect x="1240" y="24" width="320" height="76" rx="14" class="bluebg"/>
<text x="1265" y="54" class="h3" fill="#1e3a8a">CODE MAY BE GREEN.</text>
<text x="1265" y="80" class="h3" fill="#1e3a8a">INTENT IS NOT YET ESTABLISHED.</text>

<rect x="36" y="130" width="225" height="300" rx="18" class="card"/>
<circle cx="62" cy="157" r="18" fill="#334155"/><text x="56" y="164" class="body white">1</text>
<text x="88" y="164" class="h3 ink">Ambiguous request</text>
<rect x="55" y="200" width="188" height="82" rx="12" class="slatebg"/>
<text x="72" y="233" class="h3 ink">“Make VIP refunds</text>
<text x="72" y="258" class="h3 ink">automatic.”</text>
<text x="55" y="324" class="body muted">Looks simple.</text>
<text x="55" y="350" class="body muted">But it can mean</text>
<text x="55" y="376" class="body muted">different products.</text>

<rect x="279" y="130" width="315" height="300" rx="18" class="card"/>
<circle cx="305" cy="157" r="18" fill="#334155"/><text x="299" y="164" class="body white">2</text>
<text x="331" y="164" class="h3 ink">Bob proposes interpretations</text>
<rect x="300" y="194" width="273" height="56" rx="10" class="bluebg"/>
<text x="315" y="218" class="small ink">I1  All VIP refunds bypass approval.</text>
<rect x="300" y="260" width="273" height="72" rx="10" class="bluebg"/>
<text x="315" y="284" class="small ink">I2  Existing threshold still applies;</text>
<text x="315" y="306" class="small ink">     VIPs get no extra exemption.</text>
<rect x="300" y="342" width="273" height="72" rx="10" class="bluebg"/>
<text x="315" y="366" class="small ink">I3  Request creation is automatic;</text>
<text x="315" y="388" class="small ink">     execution remains approval-gated.</text>

<rect x="612" y="130" width="245" height="300" rx="18" class="card"/>
<circle cx="638" cy="157" r="18" fill="#334155"/><text x="632" y="164" class="body white">3</text>
<text x="664" y="164" class="h3 ink">Semantic fork</text>
<text x="638" y="220" class="body muted">Observable behaviour</text>
<text x="638" y="246" class="body muted">diverges on the same probe.</text>
<rect x="636" y="278" width="197" height="84" rx="12" class="redbg"/>
<text x="670" y="311" class="h3 red">SEMANTIC FORK</text>
<text x="683" y="342" class="h3 red">Guess Debt = 1</text>
<text x="638" y="397" class="small muted">Deterministic materiality check.</text>

<rect x="875" y="130" width="330" height="300" rx="18" class="card"/>
<circle cx="901" cy="157" r="18" fill="#334155"/><text x="895" y="164" class="body white">4</text>
<text x="927" y="164" class="h3 ink">Clarification to human</text>
<rect x="895" y="193" width="290" height="102" rx="12" class="bluebg"/>
<text x="912" y="218" class="small ink">A VIP customer requests ₹15,000</text>
<text x="912" y="240" class="small ink">and no manager has approved it.</text>
<text x="912" y="269" class="small ink" font-weight="700">What should happen?</text>
<text x="900" y="326" class="small muted">• Create request; execution waits for approval</text>
<text x="900" y="350" class="small muted">• Keep refund blocked; threshold applies</text>
<text x="900" y="374" class="small muted">• Execute automatically; skip approval</text>
<text x="900" y="398" class="small muted">• Other / none of these</text>

<rect x="1223" y="130" width="160" height="300" rx="18" class="card"/>
<circle cx="1249" cy="157" r="18" fill="#334155"/><text x="1243" y="164" class="body white">5</text>
<text x="1275" y="164" class="h3 ink">Human</text>
<text x="1275" y="189" class="h3 ink">decision</text>
<circle cx="1303" cy="257" r="42" fill="#22c55e"/>
<path d="M1283 257 l14 14 l28 -32" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1241" y="325" class="tiny green" font-weight="700">HumanDecision</text>
<text x="1241" y="344" class="tiny green" font-weight="700">Recorded</text>
<text x="1241" y="374" class="small muted">Guess Debt resolved</text>
<text x="1241" y="397" class="small muted">by explicit authority.</text>

<rect x="1401" y="130" width="163" height="300" rx="18" class="card"/>
<circle cx="1427" cy="157" r="18" fill="#334155"/><text x="1421" y="164" class="body white">6</text>
<text x="1453" y="164" class="h3 ink">Capability</text>
<text x="1453" y="189" class="h3 ink">+ receipt</text>
<rect x="1420" y="228" width="125" height="72" rx="12" class="greenbg"/>
<text x="1432" y="256" class="small green" font-weight="700">CAPABILITY GRANTED</text>
<text x="1437" y="279" class="tiny green">from explicit basis</text>
<text x="1420" y="337" class="small ink" font-weight="700">Epistemic Receipt</text>
<text x="1420" y="361" class="tiny muted">what was known</text>
<text x="1420" y="380" class="tiny muted">what was inferred</text>
<text x="1420" y="399" class="tiny muted">who decided + why</text>

<path d="M261 280 L279 280" class="arrow"/>
<path d="M594 280 L612 280" class="arrow"/>
<path d="M857 280 L875 280" class="arrow"/>
<path d="M1205 280 L1223 280" class="arrow"/>
<path d="M1383 280 L1401 280" class="arrow"/>

<rect x="36" y="458" width="1528" height="154" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="58" y="493" class="h2 ink">Control architecture</text>
<text x="58" y="519" class="small muted">AI proposes. Kernel disposes.</text>
<rect x="285" y="478" width="1230" height="48" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
<text x="635" y="508" class="h3" fill="#4c1d95">Epistemic Kernel — deterministic admission, trust boundaries, authority rules</text>
<rect x="285" y="542" width="1230" height="48" rx="12" class="amberbg" stroke="#f59e0b"/>
<text x="660" y="572" class="h3 amber">Immutable Event Ledger — authoritative, append-only, hash chained</text>
<text x="310" y="603" class="tiny muted">Evidence + authority → interpretations → semantic fork/materiality → clarification → capability → receipt</text>

<text x="40" y="655" class="h2 ink">Three demo outcomes</text>
<rect x="38" y="677" width="450" height="177" rx="16" class="redbg" stroke="#fecaca"/>
<text x="60" y="712" class="h3 red">1  No human answer</text>
<text x="60" y="748" class="small ink">Guess Debt: unresolved</text>
<text x="60" y="772" class="small ink">Capability: DENIED</text>
<text x="60" y="796" class="small ink">State: BLOCKED_UNRESOLVED_INTENT</text>
<text x="60" y="828" class="small red" font-weight="700">Working code is not enough.</text>

<rect x="505" y="677" width="450" height="177" rx="16" class="greenbg" stroke="#bbf7d0"/>
<text x="527" y="712" class="h3 green">2  Explicit human selection</text>
<text x="527" y="748" class="small ink">HumanDecisionRecorded</text>
<text x="527" y="772" class="small ink">Guess Debt: resolved</text>
<text x="527" y="796" class="small ink">Capability: GRANTED from explicit basis</text>
<text x="527" y="828" class="small green" font-weight="700">State: READY_FOR_IMPLEMENTATION</text>

<rect x="972" y="677" width="328" height="177" rx="16" class="bluebg" stroke="#bfdbfe"/>
<text x="994" y="712" class="h3" fill="#1e3a8a">3  Other / none</text>
<text x="994" y="748" class="small ink">NEEDS_EXTERNAL_INPUT</text>
<text x="994" y="772" class="small ink">No resolution is fabricated.</text>
<text x="994" y="806" class="small" fill="#1e3a8a" font-weight="700">BLOCKED_UNRESOLVED_INTENT</text>

<rect x="1317" y="677" width="247" height="177" rx="16" class="card"/>
<text x="1337" y="710" class="h3 ink">Authority model</text>
<text x="1337" y="737" class="tiny muted">Scope-sensitive partial order.</text>
<text x="1337" y="759" class="tiny muted">No universal ranking.</text>
<text x="1337" y="781" class="tiny muted">Confidence never upgrades authority.</text>
<text x="1337" y="811" class="tiny blue" font-weight="700">Bob: MODEL_INFERENCE only</text>
<text x="1337" y="833" class="tiny green" font-weight="700">Human: HUMAN_RESOLVED</text>

<text x="40" y="883" class="small muted">Validated: TypeScript PASS · 364 / 364 tests · 0 failures · frozen core tag: final-core-pass</text>
</svg>